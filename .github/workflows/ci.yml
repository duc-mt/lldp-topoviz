name: 🚀 CI/CD & Release
 
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
 
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
permissions:
  contents: write
 
jobs:
  test:
    name: ⤵️ Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest ruff

      - name: Lint with Ruff
        run: ruff check .

      - name: Run test suite
        run: pytest tests/ -v

  build-linux:
    name: ⤵️ Build Linux Binary
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller and dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install ntc-templates

      - name: Package with PyInstaller
        run: |
          pyinstaller --onefile \
            --name lldp-topoviz-linux-amd64 \
            --add-data "templates:templates" \
            --add-data "config:config" \
            --collect-all ntc_templates \
            --collect-all pyvis \
            main.py

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: lldp-topoviz-linux
          path: dist/lldp-topoviz-linux-amd64

  build-windows:
    name: ⤵️ Build Windows Binary
    needs: [test]
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pip install ntc-templates

      - name: Package with PyInstaller
        run: |
          pyinstaller --onefile `
            --name lldp-topoviz-windows-amd64 `
            --add-data "templates;templates" `
            --add-data "config;config" `
            --collect-all ntc_templates `
            --collect-all pyvis `
            main.py

      - name: Upload Windows Binary
        uses: actions/upload-artifact@v4
        with:
          name: lldp-topoviz-windows
          path: dist/lldp-topoviz-windows-amd64.exe

  release:
    name: 🚀 GitHub Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: lldp-topoviz-linux
          path: bin

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: lldp-topoviz-windows
          path: bin

      - name: Generate Checksums
        run: |
          cd bin
          chmod +x lldp-topoviz-linux-amd64 2>/dev/null || true
          sha256sum lldp-topoviz-* > checksums.txt 2>/dev/null || shasum -a 256 lldp-topoviz-* > checksums.txt
          cat checksums.txt

      - name: Determine Release Info
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag_name=${tag}" >> $GITHUB_OUTPUT
            echo "release_name=${tag}" >> $GITHUB_OUTPUT
            echo "generate_notes=true" >> $GITHUB_OUTPUT
            touch release_body.md
          else
            echo "tag_name=latest" >> $GITHUB_OUTPUT
            echo "release_name=Latest Build" >> $GITHUB_OUTPUT
            echo "generate_notes=false" >> $GITHUB_OUTPUT
            git log -1 --format="### 🚀 Latest Automated Build (%cd)%n%n- **Commit**: [\`%h\`](https://github.com/${GITHUB_REPOSITORY}/commit/%H)%n- **Message**: %s%n%n[View commit history](https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME})" --date=short > release_body.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          body_path: release_body.md
          files: |
            bin/lldp-topoviz-*
            bin/checksums.txt
          generate_release_notes: ${{ steps.release_info.outputs.generate_notes }}
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
